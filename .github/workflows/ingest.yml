name: Ingest

# The daily job runs by itself once a day; weekly and monthly are started by hand only.
on:
  schedule:
    # 03:47 UTC (04:47 in Paris, off-peak for BIPM), deliberately not on the hour. A scheduled run has
    # no inputs, so JOB below defaults to daily. GitHub may start it a few minutes late.
    - cron: "47 3 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        options: [daily, weekly, monthly]
        default: daily

# issues: open an issue when a run fails. contents: push the snapshot to the `data` branch.
permissions:
  issues: write
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Which job this run does: the chosen one for a manual run, always daily for a scheduled one.
      JOB: ${{ inputs.job || 'daily' }}
      # The secrets are the production database and the contact address for the User-Agent.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TIMEGLOBE_CONTACT: ${{ secrets.TIMEGLOBE_CONTACT }}
      # The one place a database run is allowed (see config.require_db_opt_in).
      TIMEGLOBE_ALLOW_DB: "1"
    steps:
      # Actions are pinned to full commit SHAs (the version is the comment); Dependabot proposes updates.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml

      # Editable on purpose: the migrations folder and labs.csv are found relative to the checkout.
      - name: Install the pipeline
        run: pip install -e ./pipeline

      - name: Apply pending migrations
        run: python -m timeglobe_pipeline.migrate

      - name: Run the ${{ env.JOB }} job
        run: python -m timeglobe_pipeline.run "$JOB"

      - name: Build the snapshot from the database
        run: python -m timeglobe_pipeline.run snapshot --out snapshot

      - name: Publish the snapshot to the data branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          circular_t="$(jq -r .circular_t_latest snapshot/meta.json)"
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git worktree add -B data ../data-branch origin/data
          else
            git worktree add --detach ../data-branch
            git -C ../data-branch checkout --orphan data
            git -C ../data-branch rm -rf --quiet . || true
          fi
          rsync -a --delete --exclude .git snapshot/ ../data-branch/
          cd ../data-branch
          git add -A
          if git diff --cached --quiet; then
            echo "The snapshot is unchanged; nothing to publish."
          else
            git commit -m "data: ${JOB} $(date -u +%F), Circular T ${circular_t}"
            git push origin data
          fi

      # One open issue per job: a daily failure that repeats adds a comment instead of a new issue.
      - name: Open an issue when the run failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Ingest failed: ${JOB}"
          existing="$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "Failed again. Logs: ${RUN_URL}"
          else
            gh issue create --title "${title}" --body "The ${JOB} ingest failed. Logs: ${RUN_URL}"
          fi
