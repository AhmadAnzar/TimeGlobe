name: Ingest

# Manual only. There is deliberately no schedule: a cron is added only when the maintainer says so.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        options: [daily, weekly, monthly]
        default: daily

# issues: open an issue when a run fails. contents: push the snapshot to the `data` branch.
permissions:
  issues: write
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The secrets are the production database and the contact address for the User-Agent.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TIMEGLOBE_CONTACT: ${{ secrets.TIMEGLOBE_CONTACT }}
      # The one place a database run is allowed (see config.require_db_opt_in).
      TIMEGLOBE_ALLOW_DB: "1"
    steps:
      # Actions are pinned to full commit SHAs (the version is the comment); Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml

      - name: Install the pipeline
        run: pip install ./pipeline

      - name: Apply pending migrations
        run: python -m timeglobe_pipeline.migrate

      - name: Run the ${{ inputs.job }} job
        run: python -m timeglobe_pipeline.run ${{ inputs.job }}

      - name: Build the snapshot from the database
        run: python -m timeglobe_pipeline.run snapshot --out snapshot

      - name: Publish the snapshot to the data branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          circular_t="$(jq -r .circular_t_latest snapshot/meta.json)"
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git worktree add -B data ../data-branch origin/data
          else
            git worktree add --detach ../data-branch
            git -C ../data-branch checkout --orphan data
            git -C ../data-branch rm -rf --quiet . || true
          fi
          rsync -a --delete --exclude .git snapshot/ ../data-branch/
          cd ../data-branch
          git add -A
          if git diff --cached --quiet; then
            echo "The snapshot is unchanged; nothing to publish."
          else
            git commit -m "data: ${{ inputs.job }} $(date -u +%F), Circular T ${circular_t}"
            git push origin data
          fi

      - name: Open an issue when the run failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Ingest failed: ${{ inputs.job }} (run ${{ github.run_id }})" \
            --body "The ${{ inputs.job }} ingest failed. Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
